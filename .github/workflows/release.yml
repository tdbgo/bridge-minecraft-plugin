name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: bridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be v followed by a semantic version." >&2
            exit 1
          fi
          echo "BRIDGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build release artifacts
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease -PbridgeVersion="$BRIDGE_VERSION" --no-daemon --console=plain

      - name: Verify release artifacts
        run: >-
          python ops/verify-release-artifacts.py
          --plugin "build/release/Bridge-$BRIDGE_VERSION.jar"
          --api "build/release/bridge-api-$BRIDGE_VERSION.jar"
          --expect-version "$BRIDGE_VERSION"

      - name: Attest checksummed artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: build/release/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$BRIDGE_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" build/release/* \
            --verify-tag \
            --generate-notes \
            --title "Bridge $BRIDGE_VERSION" \
            "${prerelease[@]}"
